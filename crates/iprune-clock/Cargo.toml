[package]
name = "iprune-clock"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The system time zone (/etc/localtime) and the zoneinfo files only.
jiff = { version = "1.0.0", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }

[dev-dependencies]
tempfile = "3.27.0"
